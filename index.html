<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>KulturKonvoi CRM</title>
<meta name="theme-color" content="#2d5a3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KK CRM">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="./colors_and_type.css">
<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100dvh; display: flex; flex-direction: column; }
  button { font: inherit; }
  .scs-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#8a8578}
  @keyframes rec-halo{0%,100%{box-shadow:0 0 0 0 rgba(160,64,64,.45)}50%{box-shadow:0 0 0 14px rgba(160,64,64,0)}}
  @keyframes live-dot{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes wave{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  .kk-card{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-left:4px solid var(--accent, #2d5a3d);text-align:left;cursor:pointer}
  .kk-card:active{background:#eae5d9}
  .kk-back{display:flex;align-items:center;gap:8px;cursor:pointer;color:#8a8578;font-size:14px;background:none;border:none;padding:0}
  .kk-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:#1a1a18;color:#faf8f4;padding:11px 18px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity 220ms ease,transform 220ms ease;z-index:9999;max-width:84vw;text-align:center}
  .kk-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="kk-toast"></div>
<script>
(function () {
  "use strict";

  var ACC = { belegt: '#2d5a3d', offen: '#c4873b', vorschlag: '#b8602a', faint: '#b8b2a6' };

  var state = {
    route: 'home',
    rec: 'idle',
    sec: 0,
    recError: '',
    transcript: '',
    interimTranscript: '',
    fields: [],
    stack: [
      { name: 'Elena Wirth', note: 'Kulturamt, will Programmheft-Kooperation', rolle: 'LEAD', tint: '#2d5a3d' },
      { name: 'Tobias Renner', note: 'Fotograf, fragt nach Foto-Freigabe', rolle: 'PARTNER', tint: '#6b5c4a' },
      { name: 'Sabine Kolb', note: 'ZONE3000, nicht taggen', rolle: 'SPONSOR', tint: '#b8602a' }
    ],
    draftIdx: 0,
    rolle: 'Lead',
    captureMode1c: 'Visitenkarte',
    source1a: 'Visitenkarte',
    tags1a: ['VoiceOn-Gastgeber', 'Netzwerk Kommunen', 'Sponsoring-Lead'],
    saved1a: 'idle',
    taken1b: 'idle',
    scan1a: { status: 'idle', photo: null, rawText: '', progress: 0, errorMsg: '' },
    manualFields1a: { name: '', organisation: '', funktion: '', herkunft: '' },
    note1c: '',
    notifs: [
      { id: 'wv', time: 'jetzt', title: 'Wiedervorlage fällig — Dr. Katrin Behrens', body: 'Rückmeldung nach dem Urlaub zugesagt. Letzte Interaktion 21.08.2026.', primary: 'Briefing öffnen', target: '1a' },
      { id: 'mail', time: 'vor 12 Min', title: '3 Follow-up-Mails warten auf Freigabe', body: 'Entwürfe aus Surprise Surprise, Landsberg. Kein Versand ohne Freigabe.', primary: 'Prüfen', target: '2b' },
      { id: 'lauf', time: '08:00', title: 'Wochenlauf', body: '5 Wiedervorlagen fällig, 2 überfällig, 1 mögliche Dublette.', primary: 'Liste öffnen', target: null }
    ],
    tone: 'Knapp',
    activeBlocks: ['Bezug aufs Gespräch', 'VoiceOn-Anschluss'],
    mail: 'draft',
    mailIdx: 1,
    settings: [
      { id: 's1', title: 'Wiedervorlage fällig', hint: 'Am Fälligkeitstag, 08:00 — und erneut bei Überschreitung.', on: true },
      { id: 's2', title: 'Mail-Entwurf zur Freigabe', hint: 'Sobald Claude einen Follow-up-Entwurf fertig hat.', on: true },
      { id: 's3', title: 'Neue Interaktion protokolliert', hint: 'Stille Aktivität im Team, ohne Push.', on: false },
      { id: 's4', title: 'Veraltete Stände (> 6 Monate)', hint: 'Refresh-Kandidaten bei aktiven Partnern.', on: true }
    ]
  };

  var recTimer = null;
  var recognition = null;

  function getRecognition() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    if (recognition) return recognition;
    recognition = new SR();
    recognition.lang = 'de-DE';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = function (event) {
      var finalText = '';
      var interim = '';
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var res = event.results[i];
        if (res.isFinal) finalText += res[0].transcript;
        else interim += res[0].transcript;
      }
      if (finalText) state.transcript = (state.transcript + ' ' + finalText).trim();
      state.interimTranscript = interim;
      render();
    };
    recognition.onerror = function (event) {
      if (recTimer) { clearInterval(recTimer); recTimer = null; }
      var messages = {
        'not-allowed': 'Mikrofon-Zugriff wurde verweigert — bitte in den Browser-Einstellungen erlauben.',
        'no-speech': 'Keine Sprache erkannt — bitte erneut versuchen und deutlich sprechen.',
        'audio-capture': 'Kein Mikrofon gefunden.',
        'network': 'Netzwerkfehler bei der Spracherkennung — bitte Verbindung prüfen.'
      };
      state.rec = 'error';
      state.recError = messages[event.error] || ('Spracherkennung fehlgeschlagen (' + event.error + ').');
      render();
    };
    recognition.onend = function () {
      if (recTimer) { clearInterval(recTimer); recTimer = null; }
      if (state.rec === 'recording') {
        state.rec = state.transcript ? 'done' : 'error';
        if (!state.transcript) state.recError = 'Keine Sprache erkannt — bitte erneut versuchen.';
        else App._applySpeechExtraction();
      }
      render();
    };
    return recognition;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function parseCardText(rawText) {
    var lines = rawText.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    var emailRe = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
    var phoneRe = /(\+?\d[\d\s\-\/()]{6,}\d)/;
    var urlRe = /\b(?:https?:\/\/|www\.)\S+/i;
    var remaining = [];
    lines.forEach(function (line) {
      if (emailRe.test(line) || phoneRe.test(line) || urlRe.test(line)) return;
      remaining.push(line);
    });
    return {
      name: remaining[0] || '',
      funktion: remaining[1] || '',
      organisation: remaining[2] || '',
      raw: lines.join('\n')
    };
  }

  function parseSpeechFields(rawText) {
    var t = (rawText || '').trim();

    var nameMatch = t.match(/(?:Dr\.|Prof\.|Herr|Frau)?\s*[A-ZÄÖÜ][a-zäöüß]+\s+[A-ZÄÖÜ][a-zäöüß]+/);
    var name = nameMatch ? nameMatch[0].trim() : '';

    var orgMatch =
      t.match(/[A-ZÄÖÜ][\wäöüß]*(?:\s+[A-ZÄÖÜ][\wäöüß]*){0,3}\s?(?:GmbH|AG|e\.\s?V\.|KG)/) ||
      t.match(/Stadtwerke[n]?\s+[A-ZÄÖÜ][a-zäöüß]+/) ||
      t.match(/(?:bei|von (?:der|den)|für)\s+([A-ZÄÖÜ][\wäöüß]+(?:\s+[A-ZÄÖÜ][\wäöüß]+){0,2})/);
    var organisation = orgMatch ? (orgMatch[1] || orgMatch[0]).trim() : '';

    var funktionKeywords = ['Kommunikationsleitung', 'Geschäftsführ', 'Leitung', 'Referent', 'Vorstand', 'Pressesprecher', 'Marketingleit', 'Vertrieb', 'Berater', 'Manager', 'Sprecher'];
    var funktion = '';
    for (var i = 0; i < funktionKeywords.length; i++) {
      var idx = t.indexOf(funktionKeywords[i]);
      if (idx !== -1) {
        var start = Math.max(0, idx - 12);
        var end = Math.min(t.length, idx + funktionKeywords[i].length + 14);
        funktion = t.slice(start, end).trim().replace(/^[a-zäöüß]+\s/, '');
        break;
      }
    }

    var herkunftMatch = t.match(/(?:kennt (?:den|die)\s+|über\s+|durch\s+|empfohlen von\s+)([A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][a-zäöüß]+)?)/);
    var herkunft = herkunftMatch ? herkunftMatch[0].trim() : '';

    var months = 'Januar|Februar|März|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember';
    var dateMatch = t.match(new RegExp('(?:im|nächsten?|kommenden?)\\s+(?:' + months + ')[^.]{0,25}', 'i')) || t.match(/(?:nächste|kommende)\s+Woche[^.]{0,20}/i);
    var wiedervorlage = dateMatch ? dateMatch[0].trim() : '';

    return [
      { label: 'Name', value: name, quelle: 'SPRACHNOTIZ', kind: name ? 'belegt' : 'offen', warn: !name, status: 'open' },
      { label: 'Organisation', value: organisation, quelle: 'SPRACHNOTIZ', kind: organisation ? 'belegt' : 'offen', warn: !organisation, status: 'open' },
      { label: 'Funktion', value: funktion, quelle: 'SPRACHNOTIZ', kind: funktion ? 'belegt' : 'offen', warn: !funktion, status: 'open' },
      { label: 'Herkunft / Vermittler', value: herkunft, quelle: 'SPRACHNOTIZ', kind: herkunft ? 'belegt' : 'offen', warn: !herkunft, status: 'open' },
      { label: 'Anschluss / Mehrwert', value: '', quelle: 'MANUELL ERGÄNZEN', kind: 'vorschlag', warn: true, status: 'open' },
      { label: 'Wiedervorlage', value: wiedervorlage, quelle: 'SPRACHNOTIZ', kind: wiedervorlage ? 'belegt' : 'offen', warn: !wiedervorlage, status: 'open' }
    ];
  }

  var toastTimer = null;
  function showToast(msg) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2800);
  }

  function backBar(title) {
    return '' +
      '<div style="padding:calc(env(safe-area-inset-top,20px) + 14px) 18px 14px;background:rgba(250,248,244,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(180,172,158,.4);display:flex;align-items:center;gap:10px">' +
        '<button class="kk-back" onclick="App.nav(\'home\')">‹ Übersicht</button>' +
        '<span class="scs-lbl" style="margin-left:auto">' + esc(title) + '</span>' +
      '</div>';
  }

  var MENU = [
    { id: '1a', title: 'Strukturiertes Formular', desc: 'Kontakt erfassen — nah am Sheet-Schema, alles sichtbar.', accent: '#2d5a3d' },
    { id: '1b', title: 'Sprachnotiz → Diff-Bestätigung', desc: 'Reden statt tippen, jedes Feld einzeln bestätigen.', accent: '#b8602a' },
    { id: '1c', title: 'Event-Modus: Stapel', desc: 'Schnellerfassung auf dem Event, Nachlese später.', accent: '#1e3f2b' },
    { id: '2a', title: 'Push auf dem Lockscreen', desc: 'Fällige Wiedervorlage, Mail-Freigabe, Wochenlauf.', accent: '#1e3f2b' },
    { id: '2b', title: 'Follow-up-Mail zur Freigabe', desc: 'Entwurf prüfen, Tonfall wählen, freigeben und senden.', accent: '#2d5a3d' },
    { id: '2c', title: 'Regeln für Benachrichtigungen', desc: 'Anlässe, Ruhezeiten — Auto-Versand bleibt gesperrt.', accent: '#6b5c4a' }
  ];

  function screenHome() {
    var cards = MENU.map(function (m) {
      return '' +
        '<div class="kk-card" style="--accent:' + m.accent + '" onclick="App.nav(\'' + m.id + '\')">' +
          '<div style="display:flex;align-items:baseline;gap:8px">' +
            '<span style="font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a18;border-radius:5px">' + m.id + '</span>' +
            '<span style="font-size:15px;font-weight:600;color:#1a1a18">' + esc(m.title) + '</span>' +
          '</div>' +
          '<div style="font-size:12.5px;line-height:1.5;color:#8a8578">' + esc(m.desc) + '</div>' +
        '</div>';
    }).join('');
    return '' +
      '<div style="min-height:100dvh;display:flex;flex-direction:column;background:#f4f1ea">' +
        '<div style="padding:calc(env(safe-area-inset-top,20px) + 22px) 20px 18px">' +
          '<div class="scs-lbl">Kultur.Konvoi</div>' +
          '<div style="font-size:26px;font-weight:600;color:#1a1a18;letter-spacing:-.3px;margin-top:4px">CRM-Prototyp</div>' +
          '<div style="font-size:13px;color:#8a8578;margin-top:6px;line-height:1.5">Prototyp ohne Backend — die Interaktionen sind echt, die Daten sind Beispiel.</div>' +
        '</div>' +
        '<div style="flex:1;padding:0 20px calc(env(safe-area-inset-bottom,20px) + 24px);display:flex;flex-direction:column;gap:12px">' + cards + '</div>' +
      '</div>';
  }

  function screen1a() {
    var sourceTabsHtml = ['Visitenkarte', 'Sprachnotiz', 'Manuell'].map(function (s) {
      var active = state.source1a === s;
      return '<button onclick="App.setSource1a(\'' + s + '\')" style="flex:1;cursor:pointer;text-align:center;padding:8px 4px;border-radius:8px;font-size:11px;font-weight:600;border:1px solid ' + (active ? '#2d5a3d' : 'rgba(180,172,158,.4)') + ';background:' + (active ? '#2d5a3d' : 'rgba(250,248,244,.7)') + ';color:' + (active ? '#faf8f4' : '#3d3b36') + '">' + s + '</button>';
    }).join('');

    var srcBlock;
    if (state.source1a === 'Visitenkarte') {
      var sc = state.scan1a;
      var fileInputHtml = '<input type="file" accept="image/*" capture="environment" id="vk-file-input" style="display:none" onchange="App.handleCardPhoto(this.files[0])">';
      if (sc.status === 'scanning') {
        srcBlock = '' +
          fileInputHtml +
          '<div style="display:flex;gap:12px;padding:12px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px;align-items:center">' +
            (sc.photo ? '<img src="' + sc.photo + '" style="width:58px;height:44px;object-fit:cover;border-radius:6px;border:1px solid #d5cfc3;flex-shrink:0">' : '<div style="width:58px;height:44px;border-radius:6px;background:#eae5d9;flex-shrink:0"></div>') +
            '<div style="flex:1"><div class="scs-lbl">Texterkennung läuft …</div><div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#3d3b36;margin-top:4px">' + (sc.progress || 0) + '%</div></div>' +
          '</div>';
      } else if (sc.status === 'done') {
        srcBlock = '' +
          fileInputHtml +
          '<div style="display:flex;gap:12px;padding:12px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px;align-items:center">' +
            '<img src="' + sc.photo + '" style="width:58px;height:44px;object-fit:cover;border-radius:6px;border:1px solid #d5cfc3;flex-shrink:0">' +
            '<div style="flex:1"><div class="scs-lbl">Aus Foto erkannt</div><div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:#3d3b36;margin-top:4px">Bitte Felder unten prüfen</div></div>' +
            '<button onclick="document.getElementById(\'vk-file-input\').click()" style="cursor:pointer;flex-shrink:0;padding:8px 10px;border-radius:8px;border:1px solid rgba(180,172,158,.4);background:transparent;color:#3d3b36;font-size:11px;font-weight:600">↻ Neu</button>' +
          '</div>' +
          (sc.rawText ? '<div style="padding:9px 12px;background:#eae5d9;border-radius:8px;font-family:\'JetBrains Mono\',monospace;font-size:10px;color:#3d3b36;line-height:1.5;white-space:pre-wrap;max-height:76px;overflow:auto">' + esc(sc.rawText) + '</div>' : '');
      } else if (sc.status === 'error') {
        srcBlock = '' +
          fileInputHtml +
          '<div style="padding:12px 14px;background:rgba(160,64,64,.07);border:1px solid rgba(160,64,64,.35);border-radius:10px">' +
            '<div style="font-size:13px;font-weight:600;color:#1a1a18">' + esc(sc.errorMsg) + '</div>' +
            '<button onclick="document.getElementById(\'vk-file-input\').click()" style="margin-top:8px;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(180,172,158,.4);background:transparent;color:#3d3b36;font-size:12px;font-weight:600">Erneut versuchen</button>' +
          '</div>';
      } else {
        srcBlock = '' +
          fileInputHtml +
          '<button onclick="document.getElementById(\'vk-file-input\').click()" style="cursor:pointer;width:100%;padding:22px 14px;border:1.5px dashed #b8b2a6;border-radius:10px;background:#faf8f4;color:#3d3b36;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px">' +
            '<span style="font-size:22px;line-height:1">📷</span>Visitenkarte fotografieren' +
          '</button>';
      }
    } else if (state.source1a === 'Sprachnotiz') {
      var recording1a = state.rec === 'recording';
      var timer1a = String(Math.floor(state.sec / 60)).padStart(2, '0') + ':' + String(state.sec % 60).padStart(2, '0');
      var micBtn1a = '<button onclick="App.toggleRec()" style="width:52px;height:52px;border-radius:999px;border:none;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:' + (recording1a ? '#a04040' : '#1e3f2b') + ';animation:' + (recording1a ? 'rec-halo 1.6s ease-in-out infinite' : 'none') + '">' +
        '<span style="width:16px;height:16px;border-radius:' + (recording1a ? '4px' : '999px') + ';background:#faf8f4;display:block"></span>' +
      '</button>';
      if (state.rec === 'error') {
        srcBlock = '' +
          '<div style="padding:12px 14px;background:rgba(160,64,64,.07);border:1px solid rgba(160,64,64,.35);border-radius:10px">' +
            '<div style="font-size:13px;font-weight:600;color:#1a1a18">' + esc(state.recError) + '</div>' +
            '<button onclick="App.toggleRec()" style="margin-top:8px;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(180,172,158,.4);background:transparent;color:#3d3b36;font-size:12px;font-weight:600">Erneut versuchen</button>' +
          '</div>';
      } else {
        srcBlock = '' +
          '<div style="padding:12px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px;display:flex;align-items:center;gap:14px">' +
            micBtn1a +
            '<div style="flex:1;min-width:0">' +
              (recording1a ? waveformHtml(true) : (state.rec === 'done' ? '<div class="scs-lbl">Aus Sprachnotiz erkannt</div>' : '<div class="scs-lbl">Bereit zur Aufnahme</div>')) +
              '<div style="font-size:11px;color:#8a8578;margin-top:6px">' + (recording1a ? ('Aufnahme läuft (' + timer1a + ') — Tippen beendet') : (state.rec === 'done' ? ('Aufnahme beendet · ' + timer1a) : 'Tippen zum Aufnehmen — echtes Mikrofon')) + '</div>' +
            '</div>' +
          '</div>' +
          (state.rec === 'done' && state.transcript ? '<div style="padding:9px 12px;background:#eae5d9;border-radius:8px;font-size:12px;color:#3d3b36;line-height:1.5;max-height:70px;overflow:auto">„' + esc(state.transcript) + '"</div>' : '');
      }
    } else {
      srcBlock = '';
    }

    var showEditable = state.source1a === 'Manuell' || (state.source1a === 'Visitenkarte' && state.scan1a.status === 'done') || (state.source1a === 'Sprachnotiz' && state.rec === 'done');
    var awaitingScan = (state.source1a === 'Visitenkarte' && state.scan1a.status !== 'done') || (state.source1a === 'Sprachnotiz' && state.rec !== 'done');

    var nameBlock, orgFuncBlock, herkunftBlock;
    if (awaitingScan) {
      nameBlock = ''; orgFuncBlock = ''; herkunftBlock = '';
    } else if (showEditable) {
      nameBlock = '' +
        '<div style="padding:12px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px">' +
          '<div class="scs-lbl">Name</div>' +
          '<input type="text" value="' + esc(state.manualFields1a.name) + '" placeholder="Name eingeben" onblur="App.updateManualField1a(\'name\', this.value)" style="display:block;width:100%;border:none;background:transparent;font-size:17px;font-weight:600;color:#1a1a18;margin-top:4px;padding:0;font-family:inherit;outline:none">' +
        '</div>';
      orgFuncBlock = '' +
        '<div style="display:flex;gap:10px">' +
          '<div style="flex:1;padding:12px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px"><div class="scs-lbl">Organisation</div>' +
            '<input type="text" value="' + esc(state.manualFields1a.organisation) + '" placeholder="Organisation eingeben" onblur="App.updateManualField1a(\'organisation\', this.value)" style="display:block;width:100%;border:none;background:transparent;font-size:14px;color:#1a1a18;margin-top:4px;padding:0;font-family:inherit;outline:none"></div>' +
          '<div style="flex:1;padding:12px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px"><div class="scs-lbl">Funktion</div>' +

            '</div>' +
          '</div>' +
          '<div style="padding:12px 14px;background:#eae5d9;border-radius:10px;font-size:12px;line-height:1.5;color:#3d3b36">Postfach verbunden: <span style="font-family:\'JetBrains Mono\',monospace;font-size:11.5px">team@kulturkonvoi.de</span> · Signatur wird aus dem Postfach übernommen.</div>' +
        '</div>' +
      '</div>';
  }

  var SCREENS = { home: screenHome, '1a': screen1a, '1b': screen1b, '1c': screen1c, '2a': screen2a, '2b': screen2b, '2c': screen2c };

  function render() {
    var fn = SCREENS[state.route] || screenHome;
    document.getElementById('root').innerHTML = fn();
  }

  window.App = {
    nav: function (route) {
      var keepRecording = route === '1b' || (route === '1a' && state.source1a === 'Sprachnotiz');
      if (!keepRecording && state.rec === 'recording' && recognition) { recognition.stop(); }
      state.route = route;
      render();
    },
    toggleRec: function () {
      if (state.rec === 'recording') {
        if (recognition) recognition.stop();
        return;
      }
      var rec = getRecognition();
      if (!rec) {
        state.rec = 'error';
        state.recError = 'Spracherkennung wird von diesem Browser nicht unterstützt (funktioniert in Chrome/Edge auf Android und Desktop; nicht in Safari/iPhone oder Firefox).';
        render();
        return;
      }
      state.transcript = '';
      state.interimTranscript = '';
      state.recError = '';
      state.fields = [];
      state.rec = 'recording';
      state.sec = 0;
      render();
      recTimer = setInterval(function () { state.sec += 1; render(); }, 1000);
      try {
        rec.start();
      } catch (e) {
        if (recTimer) { clearInterval(recTimer); recTimer = null; }
        state.rec = 'error';
        state.recError = 'Aufnahme konnte nicht gestartet werden — bitte erneut versuchen.';
        render();
      }
    },
    setStatus: function (i, status) { state.fields[i].status = status; render(); },
    updateFieldValue: function (i, value) { state.fields[i].value = value; state.fields[i].warn = !value; render(); },
    _applySpeechExtraction: function () {
      var fields = parseSpeechFields(state.transcript);
      state.fields = fields;
      var byLabel = {};
      fields.forEach(function (f) { byLabel[f.label] = f.value; });
      if (byLabel['Name']) state.manualFields1a.name = byLabel['Name'];
      if (byLabel['Organisation']) state.manualFields1a.organisation = byLabel['Organisation'];
      if (byLabel['Funktion']) state.manualFields1a.funktion = byLabel['Funktion'];
      if (byLabel['Herkunft / Vermittler']) state.manualFields1a.herkunft = byLabel['Herkunft / Vermittler'];
    },
    setRolle: function (r) { state.rolle = r; render(); },
    updateNote1c: function (value) { state.note1c = value; render(); },
    addToStack: function () {
      var drafts = [
        { name: 'Katrin Behrens', note: 'Stadtwerke, VoiceOn Regionalstrom', tint: '#2d5a3d' },
        { name: 'Jonas Feldmann', note: 'Bühnenbau, kennt Elena', tint: '#6b5c4a' },
        { name: 'Marija Petrenko', note: 'Übersetzung, Sensibilitätsflag', tint: '#8f4a1e' }
      ];
      var d = drafts[state.draftIdx % drafts.length];
      var note = state.note1c.trim() ? state.note1c.trim() : d.note;
      state.stack.unshift({ name: d.name, note: note, tint: d.tint, rolle: state.rolle.toUpperCase() });
      state.draftIdx += 1;
      state.note1c = '';
      render();
    },
    removeFromStack: function (i) { state.stack.splice(i, 1); render(); },
    dropNotif: function (id) { state.notifs = state.notifs.filter(function (n) { return n.id !== id; }); render(); },
    openNotif: function (id) {
      var n = state.notifs.find(function (x) { return x.id === id; });
      if (!n) return;
      state.notifs = state.notifs.filter(function (x) { return x.id !== id; });
      if (n.target) { App.nav(n.target); }
      else { render(); showToast('„Liste öffnen" ist in diesem Klick-Dummy nicht als eigener Screen ausgearbeitet.'); }
    },
    snoozeNotif: function (id) {
      state.notifs = state.notifs.map(function (n) { return n.id === id ? Object.assign({}, n, { snoozed: !n.snoozed }) : n; });
      render();
    },
    explainLocked: function () {
      showToast('Automatischer Versand ist bewusst gesperrt — jede Mail braucht eine dokumentierte Freigabe.');
    },
    setSource1a: function (s) {
      if (s !== 'Sprachnotiz' && state.rec === 'recording' && recognition) { recognition.stop(); }
      state.source1a = s;
      render();
    },
    handleCardPhoto: function (file) {
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        state.scan1a.photo = e.target.result;
        state.scan1a.status = 'scanning';
        state.scan1a.progress = 0;
        state.scan1a.errorMsg = '';
        render();
        App._runOcr(e.target.result);
      };
      reader.onerror = function () {
        state.scan1a.status = 'error';
        state.scan1a.errorMsg = 'Foto konnte nicht gelesen werden — bitte erneut versuchen.';
        render();
      };
      reader.readAsDataURL(file);
    },
    _tesseractLoading: null,
    _ensureTesseract: function () {
      if (window.Tesseract) return Promise.resolve();
      if (App._tesseractLoading) return App._tesseractLoading;
      App._tesseractLoading = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = resolve;
        s.onerror = function () { App._tesseractLoading = null; reject(new Error('load-failed')); };
        document.head.appendChild(s);
      });
      return App._tesseractLoading;
    },
    _runOcr: function (dataUrl) {
      App._ensureTesseract().then(function () {
        return window.Tesseract.recognize(dataUrl, 'deu', {
          logger: function (m) {
            if (m.status === 'recognizing text' && typeof m.progress === 'number') {
              state.scan1a.progress = Math.round(m.progress * 100);
              render();
            }
          }
        });
      }).then(function (result) {
        var parsed = parseCardText((result && result.data && result.data.text) || '');
        state.manualFields1a.name = parsed.name;
        state.manualFields1a.organisation = parsed.organisation;
        state.manualFields1a.funktion = parsed.funktion;
        state.scan1a.rawText = parsed.raw;
        state.scan1a.status = 'done';
        render();
      }).catch(function (err) {
        console.error('[OCR]', err);
        state.scan1a.status = 'error';
        state.scan1a.errorMsg = window.Tesseract ?
          'Texterkennung fehlgeschlagen — bitte erneut versuchen oder manuell eingeben.' :
          'Texterkennung braucht einmalig Internet zum Laden — bitte Verbindung prüfen und erneut versuchen.';
        render();
      });
    },
    updateManualField1a: function (key, value) { state.manualFields1a[key] = value; render(); },
    resetContact1a: function () {
      if (state.rec === 'recording' && recognition) { recognition.stop(); }
      if (recTimer) { clearInterval(recTimer); recTimer = null; }
      state.source1a = 'Visitenkarte';
      state.manualFields1a = { name: '', organisation: '', funktion: '', herkunft: '' };
      state.tags1a = ['VoiceOn-Gastgeber', 'Netzwerk Kommunen', 'Sponsoring-Lead'];
      state.saved1a = 'idle';
      state.scan1a = { status: 'idle', photo: null, rawText: '', progress: 0, errorMsg: '' };
      state.rec = 'idle';
      state.sec = 0;
      state.transcript = '';
      state.interimTranscript = '';
      state.recError = '';
      state.fields = [];
      render();
      showToast('Neues Kontaktformular gestartet.');
    },
    toggleTag1a: function (t) {
      var idx = state.tags1a.indexOf(t);
      if (idx === -1) state.tags1a.push(t); else state.tags1a.splice(idx, 1);
      render();
    },
    saveContact1a: function () {
      if (state.saved1a === 'saving') return;
      if (state.saved1a === 'saved') { App.nav('home'); return; }
      state.saved1a = 'saving'; render();
      setTimeout(function () { state.saved1a = 'saved'; render(); }, 700);
    },
    takeOver1b: function () {
      if (state.taken1b === 'taking') return;
      if (state.taken1b === 'taken') { App.nav('home'); return; }
      state.taken1b = 'taking'; render();
      setTimeout(function () { state.taken1b = 'taken'; render(); }, 700);
    },
    setCaptureMode1c: function (m) { state.captureMode1c = m; render(); },
    setTone: function (t) { state.tone = t; render(); },
    toggleBlock: function (b) {
      var idx = state.activeBlocks.indexOf(b);
      if (idx === -1) state.activeBlocks.push(b); else state.activeBlocks.splice(idx, 1);
      render();
    },
    sendMail: function () {
      if (state.mail === 'sending') return;
      if (state.mail === 'sent') { App.resetMail(); return; }
      state.mail = 'sending'; render();
      setTimeout(function () { state.mail = 'sent'; render(); }, 900);
    },
    resetMail: function () { state.mail = 'draft'; state.mailIdx = (state.mailIdx % 3) + 1; render(); },
    toggleSetting: function (id) {
      state.settings = state.settings.map(function (s) { return s.id === id ? Object.assign({}, s, { on: !s.on }) : s; });
      render();
    }
  };

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
