  .kk-back{display:flex;align-items:center;gap:8px;cursor:pointer;color:#8a8578;font-size:14px;background:none;border:none;padding:0}

  .kk-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    var tonesHtml = ['Knapp', 'Ausführlich', 'Sachlich'].map(function (t) {
      var active = state.tone === t;
      return '<button onclick="App.setTone(\'' + t + '\')" style="flex:1;cursor:pointer;padding:9px 4px;border-radius:8px;font-size:12px;font-weight:600;white-space:nowrap;background:' + (active ? '#2d5a3d' : 'transparent') + ';color:' + (active ? '#faf8f4' : '#3d3b36') + ';border:1px solid ' + (active ? '#2d5a3d' : 'rgba(180,172,158,.4)') + '">' + t + '</button>';
    }).join('');

    var blocksHtml = ['Bezug aufs Gespräch', 'VoiceOn-Anschluss', 'Termin vorschlagen', 'Netzwerk-Hinweis'].map(function (b) {
      var on = state.activeBlocks.indexOf(b) !== -1;
      return '<button onclick="App.toggleBlock(\'' + esc(b).replace(/'/g, "\\'") + '\')" style="cursor:pointer;padding:6px 11px;border-radius:999px;font-size:11.5px;white-space:nowrap;background:' + (on ? 'rgba(45,90,61,.07)' : 'transparent') + ';color:' + (on ? '#2d5a3d' : '#8a8578') + ';border:1px solid ' + (on ? 'rgba(45,90,61,.35)' : 'rgba(180,172,158,.4)') + '">' + esc(b) + '</button>';
    }).join('');

    var paragraphs = mailBody();
    var paragraphsHtml = paragraphs.map(function (t) { return '<div style="font-size:13.5px;line-height:1.6;color:#3d3b36">' + esc(t) + '</div>'; }).join('');
    var wordCount = paragraphs.reduce(function (n, t) { return n + t.split(/\s+/).length; }, 0) + ' Wörter · de-DE';
    var subject = state.tone === 'Ausführlich' ? 'Regionalstrom hörbar machen — Anschluss an VoiceOn' : 'Nach Landsberg: VoiceOn und Regionalstrom';

    var sentBlock = '';
    if (state.mail === 'sent') {
      sentBlock = '' +
        '<div style="padding:14px;background:rgba(45,90,61,.07);border:1px solid rgba(45,90,61,.35);border-radius:10px">' +
          '<div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:999px;background:#2d5a3d;color:#faf8f4;display:flex;align-items:center;justify-content:center;font-size:13px">✓</span><div style="font-size:13.5px;font-weight:600;color:#1a1a18">Gesendet und protokolliert</div></div>' +
          '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10.5px;line-height:1.6;color:#3d3b36;margin-top:9px">21.08.2026 21:52 · MAIL RAUS · P-0417 BEHRENS<br>WIEDERVORLAGE 08.09.2026 GESETZT</div>' +
          '<button onclick="App.resetMail()" style="margin-top:10px;cursor:pointer;background:transparent;border:none;padding:0;font-size:12px;font-weight:600;color:#2d5a3d">Nächsten Entwurf prüfen</button>' +
        '</div>';
    }

    var sendLabel = state.mail === 'sending' ? 'Sendet …' : state.mail === 'sent' ? 'Nächster' : 'Freigeben und senden';
    var sendBg = state.mail === 'sent' ? '#6b5c4a' : '#2d5a3d';
    var sendState = state.mail === 'sending' ? 'Freigabe erteilt · Übergabe ans Postfach' : state.mail === 'sent' ? 'Protokoll-Zeile geschrieben' : 'Entwurf geprüft?';

    return '' +
      '<div style="min-height:100dvh;display:flex;flex-direction:column;background:#f4f1ea">' +
        '<div style="padding:calc(env(safe-area-inset-top,20px) + 14px) 18px 12px;background:rgba(250,248,244,.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(180,172,158,.4);display:flex;align-items:center;justify-content:space-between">' +
          '<button class="kk-back" onclick="App.nav(\'home\')">‹ Übersicht</button>' +
          '<span class="scs-lbl">Follow-up · Freigabe</span>' +
          '<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#3d3b36">' + state.mailIdx + ' / 3</span>' +
        '</div>' +
        '<div style="flex:1;overflow:auto;padding:14px 18px 32px;display:flex;flex-direction:column;gap:10px">' +
          '<div style="padding:12px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px;border-left:3px solid #2d5a3d">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline"><div class="scs-lbl">Empfängerin</div><span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:#2d5a3d;letter-spacing:.5px">ADRESSE BELEGT</span></div>' +
            '<div style="font-size:15px;font-weight:600;color:#1a1a18;margin-top:5px">Dr. Katrin Behrens</div>' +
            '<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;color:#3d3b36;margin-top:3px">k.behrens@stadtwerke-landsberg.de</div>' +
            '<div style="font-size:11px;color:#8a8578;margin-top:6px">Anlass: Begegnung Surprise Surprise, 21.08.2026</div>' +
          '</div>' +
          '<div><div class="scs-lbl">Tonfall</div><div style="display:flex;gap:6px;margin-top:7px">' + tonesHtml + '</div></div>' +
          '<div><div class="scs-lbl">Bausteine</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:7px">' + blocksHtml + '</div></div>' +
          '<div style="padding:14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px">' +
            '<div class="scs-lbl">Betreff</div><div style="font-size:14px;font-weight:600;color:#1a1a18;margin-top:4px;line-height:1.35">' + esc(subject) + '</div>' +
            '<div style="height:1px;background:rgba(180,172,158,.4);margin:12px 0"></div>' +
            '<div style="display:flex;flex-direction:column;gap:10px">' + paragraphsHtml + '</div>' +
            '<div style="display:flex;gap:8px;margin-top:14px;align-items:center"><span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:.5px;color:#8a8578;border:1px solid rgba(180,172,158,.4);border-radius:999px;padding:2px 7px">ENTWURF · CLAUDE</span><span style="font-size:11px;color:#8a8578">' + wordCount + '</span></div>' +
          '</div>' +
          '<div style="padding:12px 14px;background:rgba(196,135,59,.07);border:1px solid rgba(196,135,59,.35);border-radius:10px;display:flex;gap:9px;align-items:flex-start"><span style="color:#c4873b;font-size:14px;line-height:1.2">⚠</span><div style="font-size:12px;line-height:1.5;color:#3d3b36">Freigabe zur Nennung liegt nicht vor. Bitte verzichten Sie in dieser Mail auf Namen Dritter und auf Fotomaterial.</div></div>' +
          sentBlock +
        '</div>' +
        '<div style="padding:12px 18px calc(env(safe-area-inset-bottom,20px) + 14px);background:rgba(250,248,244,.92);backdrop-filter:blur(24px);border-top:1px solid rgba(180,172,158,.4);display:flex;gap:10px;align-items:center">' +
          '<div style="flex:1"><div style="font-size:12.5px;font-weight:600;color:#1a1a18">' + sendState + '</div><div style="font-size:11px;color:#8a8578">Versand nur nach Freigabe</div></div>' +
          '<button onclick="App.sendMail()" style="cursor:pointer;border:none;padding:14px 18px;border-radius:10px;font-size:14px;font-weight:600;background:' + sendBg + ';color:#faf8f4">' + sendLabel + '</button>' +
        '</div>' +
      '</div>';
  }

  function screen2c() {
    var settingsHtml = state.settings.map(function (s) {
      return '' +
        '<div style="display:flex;align-items:center;gap:12px;padding:13px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px">' +
          '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:#1a1a18">' + esc(s.title) + '</div><div style="font-size:11.5px;color:#8a8578;line-height:1.45;margin-top:2px">' + esc(s.hint) + '</div></div>' +
          '<button onclick="App.toggleSetting(\'' + s.id + '\')" style="cursor:pointer;flex-shrink:0;width:46px;height:28px;border-radius:999px;border:1px solid ' + (s.on ? '#2d5a3d' : 'rgba(180,172,158,.4)') + ';background:' + (s.on ? '#2d5a3d' : '#eae5d9') + ';position:relative;padding:0">' +
            '<span style="position:absolute;top:2px;left:' + (s.on ? '22px' : '2px') + ';width:22px;height:22px;border-radius:999px;background:#faf8f4;box-shadow:0 1px 3px rgba(26,26,24,.25);transition:left 220ms cubic-bezier(.4,0,.2,1)"></span>' +
          '</button>' +
        '</div>';
    }).join('');

    return '' +
      '<div style="min-height:100dvh;display:flex;flex-direction:column;background:#f4f1ea">' +
        backBar('Benachrichtigungen') +
        '<div style="flex:1;overflow:auto;padding:16px 18px calc(env(safe-area-inset-bottom,20px) + 24px);display:flex;flex-direction:column;gap:10px">' +
          '<div class="scs-lbl">Anlässe</div>' +
          settingsHtml +
          '<div class="scs-lbl" style="margin-top:8px">Zeitfenster</div>' +
          '<div style="padding:13px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;color:#1a1a18">Ruhezeit</span><span style="font-family:\'JetBrains Mono\',monospace;font-size:13px;color:#1a1a18">22:00 – 07:30</span></div>' +
            '<div style="height:1px;background:rgba(180,172,158,.4);margin:11px 0"></div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;color:#1a1a18">Wochenlauf</span><span style="font-family:\'JetBrains Mono\',monospace;font-size:13px;color:#1a1a18">MO 08:00</span></div>' +
            '<div style="height:1px;background:rgba(180,172,158,.4);margin:11px 0"></div>' +
            '<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;color:#1a1a18">Event-Nachlese</span><span style="font-family:\'JetBrains Mono\',monospace;font-size:13px;color:#1a1a18">+2 H NACH ENDE</span></div>' +
          '</div>' +
          '<div class="scs-lbl" style="margin-top:8px">Versand</div>' +
          '<div style="padding:13px 14px;background:#faf8f4;border:1px solid rgba(180,172,158,.4);border-radius:10px;border-left:3px solid #a04040">' +
            '<div style="display:flex;align-items:center;gap:12px">' +
              '<div style="flex:1"><div style="font-size:14px;font-weight:600;color:#1a1a18">Automatisch senden</div><div style="font-size:11.5px;color:#8a8578;line-height:1.45;margin-top:2px">Gesperrt. Jede Mail braucht eine dokumentierte Freigabe.</div></div>' +
              '<button onclick="App.explainLocked()" style="cursor:pointer;width:46px;height:28px;border-radius:999px;background:#eae5d9;border:1px solid rgba(180,172,158,.4);position:relative;flex-shrink:0;padding:0"><span style="position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:999px;background:#b8b2a6"></span></button>' +
            '</div>' +
          '</div>' +
          '<div style="padding:12px 14px;background:#eae5d9;border-radius:10px;font-size:12px;line-height:1.5;color:#3d3b36">Postfach verbunden: <span style="font-family:\'JetBrains Mono\',monospace;font-size:11.5px">team@kulturkonvoi.de</span> · Signatur wird aus dem Postfach übernommen.</div>' +
        '</div>' +
      '</div>';
  }

  var SCREENS = { home: screenHome, '1a': screen1a, '1b': screen1b, '1c': screen1c, '2a': screen2a, '2b': screen2b, '2c': screen2c };

  function render() {
    var fn = SCREENS[state.route] || screenHome;
    document.getElementById('root').innerHTML = fn();
  }

  window.App = {
    nav: function (route) {
      var keepRecording = route === '1b' || (route === '1a' && state.source1a === 'Sprachnotiz');
      if (!keepRecording && recTimer) { clearInterval(recTimer); recTimer = null; }
      state.route = route;
      render();
    },
    toggleRec: function () {
      if (recTimer) { clearInterval(recTimer); recTimer = null; }
      if (state.rec === 'recording') { state.rec = 'done'; render(); return; }
      state.rec = 'recording'; state.sec = 0; render();
      recTimer = setInterval(function () {
        if (state.sec >= 38) { clearInterval(recTimer); recTimer = null; state.rec = 'done'; state.sec = 38; }
        else { state.sec += 1; }
        render();
      }, 220);
    },
    setStatus: function (i, status) { state.fields[i].status = status; render(); },
    setRolle: function (r) { state.rolle = r; render(); },
    updateNote1c: function (value) { state.note1c = value; render(); },
    addToStack: function () {
      var drafts = [
        { name: 'Katrin Behrens', note: 'Stadtwerke, VoiceOn Regionalstrom', tint: '#2d5a3d' },
        { name: 'Jonas Feldmann', note: 'Bühnenbau, kennt Elena', tint: '#6b5c4a' },
        { name: 'Marija Petrenko', note: 'Übersetzung, Sensibilitätsflag', tint: '#8f4a1e' }
      ];
      var d = drafts[state.draftIdx % drafts.length];
      var note = state.note1c.trim() ? state.note1c.trim() : d.note;
      state.stack.unshift({ name: d.name, note: note, tint: d.tint, rolle: state.rolle.toUpperCase() });
      state.draftIdx += 1;
      state.note1c = '';
      render();
    },
    removeFromStack: function (i) { state.stack.splice(i, 1); render(); },
    dropNotif: function (id) { state.notifs = state.notifs.filter(function (n) { return n.id !== id; }); render(); },
    openNotif: function (id) {
      var n = state.notifs.find(function (x) { return x.id === id; });
      if (!n) return;
      state.notifs = state.notifs.filter(function (x) { return x.id !== id; });
      if (n.target) { App.nav(n.target); }
      else { render(); showToast('„Liste öffnen" ist in diesem Klick-Dummy nicht als eigener Screen ausgearbeitet.'); }
    },
    snoozeNotif: function (id) {
      state.notifs = state.notifs.map(function (n) { return n.id === id ? Object.assign({}, n, { snoozed: !n.snoozed }) : n; });
      render();
    },
    explainLocked: function () {
      showToast('Automatischer Versand ist bewusst gesperrt — jede Mail braucht eine dokumentierte Freigabe.');
    },
    setSource1a: function (s) {
      if (s !== 'Sprachnotiz' && recTimer) { clearInterval(recTimer); recTimer = null; state.rec = 'done'; }
      state.source1a = s;
      render();
    },
    rescan1a: function () {
      if (state.scanning1a) return;
      state.scanning1a = true; render();
      setTimeout(function () {
        state.scanning1a = false;
        state.scannedAt1a = 'gerade eben';
        render();
      }, 900);
    },
    updateManualField1a: function (key, value) { state.manualFields1a[key] = value; render(); },
    resetContact1a: function () {
      if (recTimer) { clearInterval(recTimer); recTimer = null; }
      state.source1a = 'Visitenkarte';
      state.manualFields1a = { name: '', organisation: '', funktion: '', herkunft: '' };
      state.tags1a = ['VoiceOn-Gastgeber', 'Netzwerk Kommunen', 'Sponsoring-Lead'];
      state.saved1a = 'idle';
      state.scanning1a = false;
      state.scannedAt1a = '21.08.2026 19:42';
      state.rec = 'done';
      state.sec = 38;
      render();
      showToast('Neues Kontaktformular gestartet.');
    },
    toggleTag1a: function (t) {
      var idx = state.tags1a.indexOf(t);
      if (idx === -1) state.tags1a.push(t); else state.tags1a.splice(idx, 1);
      render();
    },
    saveContact1a: function () {
      if (state.saved1a === 'saving') return;
      if (state.saved1a === 'saved') { App.nav('home'); return; }
      state.saved1a = 'saving'; render();
      setTimeout(function () { state.saved1a = 'saved'; render(); }, 700);
    },
    takeOver1b: function () {
      if (state.taken1b === 'taking') return;
      if (state.taken1b === 'taken') { App.nav('home'); return; }
      state.taken1b = 'taking'; render();
      setTimeout(function () { state.taken1b = 'taken'; render(); }, 700);
    },
    setCaptureMode1c: function (m) { state.captureMode1c = m; render(); },
    setTone: function (t) { state.tone = t; render(); },
    toggleBlock: function (b) {
      var idx = state.activeBlocks.indexOf(b);
      if (idx === -1) state.activeBlocks.push(b); else state.activeBlocks.splice(idx, 1);
      render();
    },
    sendMail: function () {
      if (state.mail === 'sending') return;
      if (state.mail === 'sent') { App.resetMail(); return; }
      state.mail = 'sending'; render();
      setTimeout(function () { state.mail = 'sent'; render(); }, 900);
    },
    resetMail: function () { state.mail = 'draft'; state.mailIdx = (state.mailIdx % 3) + 1; render(); },
    toggleSetting: function (id) {
      state.settings = state.settings.map(function (s) { return s.id === id ? Object.assign({}, s, { on: !s.on }) : s; });
      render();
    }
  };

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
